<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<title>Vika 46 — öll fjölskyldan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F3EF}
a{color:#2251CC}a:hover{color:#173A96}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="min-height: 980px; background: #F4F3EF; color: #1C1E24; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.4">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 32px 48px; box-sizing: border-box">

<header style="display: flex; align-items: center; gap: 24px; padding: 18px 0; flex-wrap: wrap; border-bottom: 1px solid #E3E1DA">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="12" height="12" rx="3" fill="#2F6FED"></rect><rect x="15" y="1" width="12" height="12" rx="3" fill="#D9711C"></rect><rect x="1" y="15" width="12" height="12" rx="3" fill="#1F8A4C"></rect><rect x="15" y="15" width="12" height="12" rx="3" fill="#8E4FE0"></rect></svg>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.01em">Dagatal</span>
<span style="color: #5F6470; font-size: 14px">· Snekkjó</span>
</div>
<nav aria-label="Aðalvalmynd" style="display: flex; gap: 4px; flex: 1">
<a href="#" aria-current="page" style="padding: 10px 14px; border-radius: 10px; background: #1C1E24; color: #FFFFFF; text-decoration: none; font-weight: 500">Vika</a>
<a href="Schedule.dc.html" style="padding: 10px 14px; border-radius: 10px; color: #1C1E24; text-decoration: none; font-weight: 500">Stundaskrár</a>
<a href="Household.dc.html" style="padding: 10px 14px; border-radius: 10px; color: #1C1E24; text-decoration: none; font-weight: 500">Heimilið</a>
</nav>
<div style="display: flex; align-items: center; gap: 12px">
<button type="button" aria-label="Tungumál: íslenska. Skipta yfir í ensku" style="border: 1px solid #E3E1DA; background: #FFFFFF; border-radius: 999px; padding: 8px 12px; min-height: 40px; font-size: 13px; font-weight: 600; color: #1C1E24">IS · <span style="color: #5F6470; font-weight: 500">EN</span></button>
<button type="button" aria-label="Davíð — reikningur og útskráning" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: #2F6FED; color: #FFFFFF; font-weight: 600">D</button>
</div>
</header>

<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 28px 0 18px">
<div>
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6470">Vika 46</div>
<h1 style="margin: 4px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 40px; letter-spacing: -0.02em; line-height: 1.05">9.–15. nóvember</h1>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<button type="button" aria-label="Fyrri vika" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E3E1DA; background: #FFFFFF; color: #1C1E24; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid #E3E1DA; background: #FFFFFF; color: #1C1E24; font-weight: 600">Í dag</button>
<button type="button" aria-label="Næsta vika" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E3E1DA; background: #FFFFFF; color: #1C1E24; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
</div>
</div>

<div role="group" aria-label="Sýna fólk" style="display: flex; gap: 8px; flex-wrap: wrap; padding-bottom: 20px">
<button type="button" onClick="{{ pickAll }}" aria-pressed="{{ allOn }}" style="{{ allStyle }}">Allir</button>
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{ c.toggle }}" aria-pressed="{{ c.on }}" style="{{ c.style }}"><span style="{{ c.dot }}"></span>{{ c.name }}</button>
</sc-for>
</div>

<div style="overflow-x: auto; border: 1px solid #E3E1DA; border-radius: 16px; background: #FFFFFF">
<div style="min-width: 1040px; display: grid; grid-template-columns: 168px repeat(7, minmax(0, 1fr))">
<div style="padding: 14px 16px; border-bottom: 1px solid #E3E1DA; font-size: 12px; color: #5F6470; display: flex; align-items: flex-end">06 – 22</div>
<sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
<div style="{{ d.style }}">
<div style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #5F6470">{{ d.name }}</div>
<div style="{{ d.numStyle }}">{{ d.num }}</div>
</div>
</sc-for>

<sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
<div style="padding: 14px 16px; border-bottom: 1px solid #E3E1DA; display: flex; gap: 10px; align-items: flex-start">
<span style="{{ r.avatar }}">{{ r.initial }}</span>
<div style="min-width: 0">
<div style="font-weight: 600">{{ r.name }}</div>
<div style="font-size: 12px; color: #5F6470">{{ r.role }}</div>
</div>
</div>
<sc-for list="{{ r.cells }}" as="cell" hint-placeholder-count="7">
<div style="{{ cell.style }}">
<div style="position: relative; height: 6px; border-radius: 3px; background: #EEECE6; margin-bottom: 8px; overflow: hidden">
<sc-for list="{{ cell.segs }}" as="s" hint-placeholder-count="1"><span style="{{ s.style }}"></span></sc-for>
</div>
<sc-for list="{{ cell.blocks }}" as="b" hint-placeholder-count="1">
<div style="{{ b.card }}">
<div style="font-size: 12px; font-variant-numeric: tabular-nums; color: #5F6470">{{ b.time }}</div>
<div style="{{ b.titleStyle }}">{{ b.title }}</div>
<sc-if value="{{ b.hasTag }}" hint-placeholder-val="{{ false }}">
<div style="{{ b.tagStyle }}">{{ b.tag }}</div>
</sc-if>
</div>
</sc-for>
</div>
</sc-for>
</sc-for>
</div>
</div>

<div style="display: flex; gap: 20px; flex-wrap: wrap; padding-top: 16px; font-size: 13px; color: #5F6470">
<span style="display: inline-flex; gap: 6px; align-items: center"><span style="padding: 1px 6px; border-radius: 4px; background: #F1EEE6; color: #4A4E57; font-size: 11px; font-weight: 600">↻ 2 vikur</span> aðra hverja viku</span>
<span style="display: inline-flex; gap: 6px; align-items: center"><span style="padding: 1px 6px; border-radius: 4px; background: #FDE8E6; color: #A32A1F; font-size: 11px; font-weight: 600">Fellur niður</span> undantekning</span>
<span style="display: inline-flex; gap: 6px; align-items: center"><span style="padding: 1px 6px; border-radius: 4px; background: #FFF3D6; color: #7A5200; font-size: 11px; font-weight: 600">Færðist</span> annar tími þessa viku</span>
<span style="display: inline-flex; gap: 6px; align-items: center"><span style="padding: 1px 6px; border-radius: 4px; background: #E3F1FF; color: #1A4FA0; font-size: 11px; font-weight: 600">Aukalega</span> bara þennan dag</span>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":980}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { picked: [] }; }
  renderVals() {
    const people = [
      { id: 'd', name: 'Davíð', role: 'Stjórnandi · þú', color: '#2F6FED', tint: '#E8EFFD', blocks: [
        { day: 0, s: '08:30', e: '16:30', t: 'Vinna' }, { day: 1, s: '08:30', e: '16:30', t: 'Vinna' },
        { day: 2, s: '08:30', e: '16:30', t: 'Vinna' }, { day: 3, s: '08:30', e: '16:30', t: 'Vinna' },
        { day: 4, s: '08:30', e: '15:00', t: 'Vinna' } ] },
      { id: 'a', name: 'Anna', role: 'Meðlimur', color: '#D9711C', tint: '#FCEEE2', blocks: [
        { day: 0, s: '09:00', e: '17:00', t: 'Vinna' }, { day: 1, s: '09:00', e: '17:00', t: 'Vinna' },
        { day: 2, s: '09:00', e: '13:00', t: 'Vinna', alt: true }, { day: 3, s: '09:00', e: '17:00', t: 'Vinna' },
        { day: 4, s: '17:30', e: '18:30', t: 'Jóga' } ] },
      { id: 'o', name: 'Óli', role: 'Án aðgangs', color: '#1F8A4C', tint: '#E4F3EA', blocks: [
        { day: 0, s: '08:10', e: '14:00', t: 'Skóli' }, { day: 1, s: '08:10', e: '14:00', t: 'Skóli' },
        { day: 1, s: '16:00', e: '17:00', t: 'Fótbolti' }, { day: 2, s: '08:10', e: '13:20', t: 'Skóli' },
        { day: 3, s: '08:10', e: '14:00', t: 'Skóli' }, { day: 3, s: '16:00', e: '17:00', t: 'Fótbolti' },
        { day: 4, s: '08:10', e: '12:40', t: 'Skóli' }, { day: 5, s: '10:00', e: '11:00', t: 'Sund' },
        { day: 6, s: '11:00', e: '12:30', t: 'Fótboltamót', st: 'add' } ] },
      { id: 's', name: 'Sóley', role: 'Án aðgangs', color: '#8E4FE0', tint: '#F1E9FC', blocks: [
        { day: 0, s: '08:00', e: '16:00', t: 'Leikskóli' }, { day: 1, s: '08:00', e: '16:00', t: 'Leikskóli' },
        { day: 2, s: '08:00', e: '16:00', t: 'Leikskóli' }, { day: 2, s: '15:00', e: '15:45', t: 'Píanó', st: 'cancel', note: 'Færð á fim' },
        { day: 3, s: '08:00', e: '16:00', t: 'Leikskóli' }, { day: 3, s: '16:30', e: '17:15', t: 'Píanó', st: 'move' },
        { day: 4, s: '08:00', e: '16:00', t: 'Leikskóli', st: 'cancel', note: 'Starfsdagur' } ] },
    ];
    const picked = this.state.picked;
    const today = 4;
    const mins = (x) => { const [h, m] = x.split(':').map(Number); return h * 60 + m; };
    const pct = (m) => Math.max(0, Math.min(100, ((m - 360) / 960) * 100));
    const toggle = (id) => () => {
      const cur = this.state.picked;
      this.setState({ picked: cur.includes(id) ? cur.filter((x) => x !== id) : [...cur, id] });
    };
    const chipBase = 'display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600; ';
    const chips = people.map((p) => {
      const on = picked.includes(p.id);
      return { name: p.name, on: on ? 'true' : 'false', toggle: toggle(p.id),
        style: chipBase + (on ? `background: ${p.color}; color: #FFFFFF; border: 2px solid ${p.color}` : 'background: #FFFFFF; color: #1C1E24; border: 2px solid #E3E1DA'),
        dot: `width: 10px; height: 10px; border-radius: 999px; background: ${on ? '#FFFFFF' : p.color}` };
    });
    const allOn = picked.length === 0;
    const names = ['Mán', 'Þri', 'Mið', 'Fim', 'Fös', 'Lau', 'Sun'];
    const days = names.map((n, i) => ({ name: n, num: String(9 + i),
      style: `padding: 14px 12px; border-bottom: 1px solid #E3E1DA; border-left: 1px solid #EEECE6; ${i === today ? 'background: #F2F5FE;' : ''}`,
      numStyle: `font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; line-height: 1.1; ${i === today ? 'color: #2251CC' : ''}` }));
    const tags = { cancel: ['Fellur niður', '#FDE8E6', '#A32A1F'], move: ['Færðist', '#FFF3D6', '#7A5200'], add: ['Aukalega', '#E3F1FF', '#1A4FA0'] };
    const rows = people.filter((p) => allOn || picked.includes(p.id)).map((p) => ({
      name: p.name, role: p.role, initial: p.name[0],
      avatar: `flex: none; width: 32px; height: 32px; border-radius: 999px; background: ${p.color}; color: #FFFFFF; display: grid; place-items: center; font-weight: 600; font-size: 14px`,
      cells: [0, 1, 2, 3, 4, 5, 6].map((d) => {
        const bl = p.blocks.filter((b) => b.day === d).sort((x, y) => mins(x.s) - mins(y.s));
        return {
          style: `padding: 12px 10px; border-bottom: 1px solid #E3E1DA; border-left: 1px solid #EEECE6; min-height: 120px; ${d === today ? 'background: #F7F9FE;' : ''}`,
          segs: bl.filter((b) => b.st !== 'cancel').map((b) => ({ style: `position: absolute; top: 0; bottom: 0; left: ${pct(mins(b.s))}%; width: ${pct(mins(b.e)) - pct(mins(b.s))}%; background: ${p.color}` })),
          blocks: bl.map((b) => {
            const tg = b.st ? tags[b.st] : b.alt ? ['↻ 2 vikur', '#F1EEE6', '#4A4E57'] : null;
            const cancel = b.st === 'cancel';
            return { time: `${b.s}–${b.e}`, title: b.note && cancel ? `${b.t} · ${b.note}` : b.t,
              hasTag: !!tg, tag: tg ? tg[0] : '',
              tagStyle: tg ? `display: inline-block; margin-top: 4px; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; background: ${tg[1]}; color: ${tg[2]}` : '',
              card: `margin-bottom: 6px; padding: 6px 8px; border-radius: 8px; border-left: 3px solid ${cancel ? '#C9C6BD' : p.color}; background: ${cancel ? '#F6F5F1' : p.tint}`,
              titleStyle: `font-size: 13px; font-weight: 600; ${cancel ? 'text-decoration: line-through; color: #5F6470' : ''}` };
          }),
        };
      }),
    }));
    return {
      chips, days, rows, allOn: allOn ? 'true' : 'false',
      pickAll: () => this.setState({ picked: [] }),
      allStyle: chipBase + (allOn ? 'background: #1C1E24; color: #FFFFFF; border: 2px solid #1C1E24' : 'background: #FFFFFF; color: #1C1E24; border: 2px solid #E3E1DA'),
    };
  }
}
</script>
</body>
</html>
