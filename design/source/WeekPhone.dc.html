<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<title>Vikan í síma — föstudagur</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2251CC}a:hover{color:#173A96}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F3EF; color: #1C1E24; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.4; display: flex; flex-direction: column; overflow: hidden">

<div style="padding: 20px 20px 0; display: flex; align-items: center; justify-content: space-between">
<div>
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6470">Vika 46 · Snekkjó</div>
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.02em">Nóvember</div>
</div>
<button type="button" aria-label="Davíð — reikningur" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: #2F6FED; color: #FFFFFF; font-weight: 600">D</button>
</div>

<div role="tablist" aria-label="Dagar vikunnar" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 16px 12px 8px">
<sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
<button type="button" role="tab" aria-selected="{{ d.sel }}" style="{{ d.style }}">
<span style="font-size: 11px; font-weight: 600; text-transform: uppercase">{{ d.n }}</span>
<span style="font-size: 18px; font-weight: 700; font-family: 'Bricolage Grotesque', sans-serif">{{ d.num }}</span>
<span style="{{ d.dots }}"></span>
</button>
</sc-for>
</div>

<div role="group" aria-label="Sýna fólk" style="display: flex; gap: 6px; padding: 8px 16px 12px; overflow-x: auto">
<button type="button" aria-pressed="true" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid #1C1E24; background: #1C1E24; color: #FFFFFF; font-size: 13px; font-weight: 600">Allir</button>
<sc-for list="{{ people }}" as="p" hint-placeholder-count="4">
<button type="button" aria-pressed="false" style="flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 2px solid #E3E1DA; background: #FFFFFF; color: #1C1E24; font-size: 13px; font-weight: 600"><span style="{{ p.dot }}"></span>{{ p.name }}</button>
</sc-for>
</div>

<div style="flex: 1; overflow: hidden; padding: 4px 16px 0">
<h2 style="margin: 4px 4px 10px; font-size: 15px; font-weight: 600">Föstudagur 13. nóvember <span style="color: #2251CC">· í dag</span></h2>
<sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
<div style="{{ it.card }}">
<div style="width: 52px; flex: none; font-variant-numeric: tabular-nums">
<div style="font-weight: 600; font-size: 14px">{{ it.s }}</div>
<div style="font-size: 12px; color: #5F6470">{{ it.e }}</div>
</div>
<div style="{{ it.bar }}"></div>
<div style="flex: 1; min-width: 0">
<div style="{{ it.titleStyle }}">{{ it.t }}</div>
<div style="font-size: 13px; color: #5F6470">{{ it.who }}</div>
</div>
<sc-if value="{{ it.hasTag }}" hint-placeholder-val="{{ false }}">
<span style="{{ it.tagStyle }}">{{ it.tag }}</span>
</sc-if>
</div>
</sc-for>
<h2 style="margin: 18px 4px 10px; font-size: 15px; font-weight: 600; color: #5F6470">Laugardagur 14.</h2>
<div style="display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E3E1DA">
<div style="width: 52px; flex: none; font-variant-numeric: tabular-nums"><div style="font-weight: 600; font-size: 14px">10:00</div><div style="font-size: 12px; color: #5F6470">11:00</div></div>
<div style="width: 4px; align-self: stretch; border-radius: 2px; background: #1F8A4C"></div>
<div><div style="font-weight: 600">Sund</div><div style="font-size: 13px; color: #5F6470">Óli</div></div>
</div>
</div>

<nav aria-label="Aðalvalmynd" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #E3E1DA; background: #FFFFFF; padding: 6px 8px 22px">
<a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; text-decoration: none; color: #1C1E24; font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>Vika</a>
<a href="Schedule.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; text-decoration: none; color: #5F6470; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>Stundaskrár</a>
<a href="Household.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; text-decoration: none; color: #5F6470; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Heimilið</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = { d: '#2F6FED', a: '#D9711C', o: '#1F8A4C', s: '#8E4FE0' };
    const people = [['Davíð', C.d], ['Anna', C.a], ['Óli', C.o], ['Sóley', C.s]]
      .map(([name, c]) => ({ name, dot: `width: 10px; height: 10px; border-radius: 999px; background: ${c}` }));
    const busy = [[C.d, C.a, C.o, C.s], [C.d, C.a, C.o, C.s], [C.d, C.a, C.o, C.s], [C.d, C.a, C.o, C.s], [C.d, C.a, C.o], [C.o], [C.o]];
    const days = ['Mán', 'Þri', 'Mið', 'Fim', 'Fös', 'Lau', 'Sun'].map((n, i) => {
      const sel = i === 4;
      const stops = busy[i].map((c, k) => `${c} ${k * 7}px ${k * 7 + 5}px, transparent ${k * 7 + 5}px ${k * 7 + 7}px`).join(', ');
      return { n, num: String(9 + i), sel: sel ? 'true' : 'false',
        style: `display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 10px; border-radius: 14px; border: 0; min-height: 44px; ${sel ? 'background: #1C1E24; color: #FFFFFF' : 'background: transparent; color: #1C1E24'}`,
        dots: `height: 5px; width: ${busy[i].length * 7 - 2}px; margin-top: 2px; background: linear-gradient(90deg, ${stops})` };
    });
    const tags = { cancel: ['Fellur niður', '#FDE8E6', '#A32A1F'] };
    const items = [
      { s: '08:00', e: '16:00', t: 'Leikskóli', who: 'Sóley · starfsdagur', c: C.s, st: 'cancel' },
      { s: '08:10', e: '12:40', t: 'Skóli', who: 'Óli', c: C.o },
      { s: '08:30', e: '15:00', t: 'Vinna', who: 'Davíð', c: C.d },
      { s: '17:30', e: '18:30', t: 'Jóga', who: 'Anna', c: C.a },
    ].map((it) => {
      const cancel = it.st === 'cancel';
      const tg = it.st ? tags[it.st] : null;
      return { ...it, hasTag: !!tg, tag: tg ? tg[0] : '',
        tagStyle: tg ? `flex: none; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; background: ${tg[1]}; color: ${tg[2]}` : '',
        card: `display: flex; gap: 12px; align-items: center; padding: 12px 14px; margin-bottom: 8px; border-radius: 14px; border: 1px solid #E3E1DA; background: ${cancel ? '#F8F7F3' : '#FFFFFF'}`,
        bar: `width: 4px; align-self: stretch; border-radius: 2px; background: ${cancel ? '#C9C6BD' : it.c}`,
        titleStyle: `font-weight: 600; ${cancel ? 'text-decoration: line-through; color: #5F6470' : ''}` };
    });
    return { days, people, items };
  }
}
</script>
</body>
</html>
